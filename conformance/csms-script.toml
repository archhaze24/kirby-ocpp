# ---------------------------------------------------------------------------------------
# 07 conformance-unlock-connector

[[steps]]
name = "unlock-connector: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:unlock-connector" }
timeout_ms = 30000

[[steps]]
name = "unlock-connector: connector 1 is Unlocked"
action = "call"
station = "${station}"
call = "UnlockConnector"
payload = { connectorId = 1 }
expect_status = "Unlocked"

[[steps]]
name = "unlock-connector: connector 99 is NotSupported"
action = "call"
station = "${station}"
call = "UnlockConnector"
payload = { connectorId = 99 }
expect_status = "NotSupported"

# ---------------------------------------------------------------------------------------
# 08 conformance-trigger-message

[[steps]]
name = "trigger-message: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:trigger-message" }
timeout_ms = 30000

[[steps]]
name = "trigger-message: Heartbeat"
action = "call"
station = "${station}"
call = "TriggerMessage"
payload = { requestedMessage = "Heartbeat" }
expect_status = "Accepted"

[[steps]]
name = "trigger-message: MeterValues"
action = "call"
station = "${station}"
call = "TriggerMessage"
payload = { requestedMessage = "MeterValues", connectorId = 1 }
expect_status = "Accepted"

[[steps]]
name = "trigger-message: DiagnosticsStatusNotification"
action = "call"
station = "${station}"
call = "TriggerMessage"
payload = { requestedMessage = "DiagnosticsStatusNotification" }
expect_status = "Accepted"

[[steps]]
name = "trigger-message: FirmwareStatusNotification"
action = "call"
station = "${station}"
call = "TriggerMessage"
payload = { requestedMessage = "FirmwareStatusNotification" }
expect_status = "Accepted"

[[steps]]
name = "trigger-message: StatusNotification"
action = "call"
station = "${station}"
call = "TriggerMessage"
payload = { requestedMessage = "StatusNotification", connectorId = 1 }
expect_status = "Accepted"

[[steps]]
name = "trigger-message: BootNotification"
action = "call"
station = "${station}"
call = "TriggerMessage"
payload = { requestedMessage = "BootNotification" }
expect_status = "Accepted"

# ---------------------------------------------------------------------------------------
# 09 conformance-configuration

[[steps]]
name = "configuration: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:configuration" }
timeout_ms = 30000

[[steps]]
name = "configuration: HeartbeatInterval is Accepted"
action = "call"
station = "${station}"
call = "ChangeConfiguration"
payload = { key = "HeartbeatInterval", value = "60" }
expect_status = "Accepted"

[[steps]]
name = "configuration: GetConfiguration returns the new value"
action = "call"
station = "${station}"
call = "GetConfiguration"
payload = { key = ["HeartbeatInterval"] }
expect_payload = { configurationKey = [ { key = "HeartbeatInterval", readonly = false, value = "60" } ] }

[[steps]]
name = "configuration: a read-only key is Rejected"
action = "call"
station = "${station}"
call = "ChangeConfiguration"
payload = { key = "NumberOfConnectors", value = "2" }
expect_status = "Rejected"

[[steps]]
name = "configuration: an unknown key is NotSupported"
action = "call"
station = "${station}"
call = "ChangeConfiguration"
payload = { key = "KirbyNoSuchKey", value = "1" }
expect_status = "NotSupported"

[[steps]]
name = "configuration: GetConfiguration lists the unknown key"
action = "call"
station = "${station}"
call = "GetConfiguration"
payload = { key = ["KirbyNoSuchKey"] }
expect_payload = { unknownKey = ["KirbyNoSuchKey"] }

# ---------------------------------------------------------------------------------------
# 10 conformance-reservation

[[steps]]
name = "reservation: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:reservation" }
timeout_ms = 30000

[[steps]]
name = "reservation: ReserveNow is Accepted"
action = "call"
station = "${station}"
call = "ReserveNow"
payload = { connectorId = 1, expiryDate = "2099-01-01T00:00:00Z", idTag = "CONF-TAG", reservationId = 7 }
expect_status = "Accepted"

[[steps]]
name = "reservation: connector reserved"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:reservation-cancel" }
timeout_ms = 30000

[[steps]]
name = "reservation: CancelReservation is Accepted"
action = "call"
station = "${station}"
call = "CancelReservation"
payload = { reservationId = 7 }
expect_status = "Accepted"

# ---------------------------------------------------------------------------------------
# 11 conformance-charging-profile

[[steps]]
name = "charging-profile: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:charging-profile" }
timeout_ms = 30000

[[steps]]
name = "charging-profile: a valid profile is Accepted"
action = "call"
station = "${station}"
call = "SetChargingProfile"
payload = { connectorId = 1, csChargingProfiles = { chargingProfileId = 1, stackLevel = 0, chargingProfilePurpose = "TxDefaultProfile", chargingProfileKind = "Absolute", chargingSchedule = { chargingRateUnit = "W", chargingSchedulePeriod = [ { startPeriod = 0, limit = 7000.0 } ] } } }
expect_status = "Accepted"

[[steps]]
name = "charging-profile: a stack level over the limit is Rejected"
action = "call"
station = "${station}"
call = "SetChargingProfile"
payload = { connectorId = 1, csChargingProfiles = { chargingProfileId = 2, stackLevel = 9999, chargingProfilePurpose = "TxDefaultProfile", chargingProfileKind = "Absolute", chargingSchedule = { chargingRateUnit = "W", chargingSchedulePeriod = [ { startPeriod = 0, limit = 7000.0 } ] } } }
expect_status = "Rejected"

[[steps]]
name = "charging-profile: GetCompositeSchedule is Accepted"
action = "call"
station = "${station}"
call = "GetCompositeSchedule"
payload = { connectorId = 1, duration = 3600 }
expect_status = "Accepted"

[[steps]]
name = "charging-profile: ClearChargingProfile is Accepted"
action = "call"
station = "${station}"
call = "ClearChargingProfile"
payload = { id = 1 }
expect_status = "Accepted"

[[steps]]
name = "charging-profile: clearing it again is Unknown"
action = "call"
station = "${station}"
call = "ClearChargingProfile"
payload = { id = 1 }
expect_status = "Unknown"

