payload_contains = { vendorId = "${vendor}", messageId = "ready:firmware-status" }
timeout_ms = 30000

[[steps]]
name = "firmware-status: UpdateFirmware is answered"
action = "call"
station = "${station}"
call = "UpdateFirmware"
payload = { location = "https://example.com/firmware.bin", retrieveDate = "2020-01-01T00:00:00Z" }
expect_payload = {}

