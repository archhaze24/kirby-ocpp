name = "conformance"
description = "Drives the scenarios of conformance/scenarios against a station: waits for the station's ready message, prepares answers, sends the CSMS commands and checks the replies"
tags = ["conformance"]

# Run it next to the scenarios (see docs/ci.md):
#
#   kirby-csms --listen 127.0.0.1:9000 --no-tui --script conformance/csms-script.toml --timeout 180 &
#   kirby-ocpp --url ws://127.0.0.1:9000/ocpp --id CP-CONF suite conformance/scenarios --tag conformance
#
# Every scenario opens with a DataTransfer from vendor "kirby.conformance" whose
# messageId is "ready:<topic>". The section of this script for that topic waits for it,
# prepares what the scenario needs, and sends "go:<topic>" when the scenario must wait for
# the preparation. The sections run in the order of the scenario file names; a run of a
# subset of the scenarios needs a script with only their sections.

[vars]
station = "CP-CONF"
vendor = "kirby.conformance"

# ---------------------------------------------------------------------------------------
# 01 conformance-authorize-rejected

[[steps]]
name = "authorize-rejected: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:authorize-rejected" }
timeout_ms = 30000

[[steps]]
name = "authorize-rejected: the next Authorize is Blocked"
action = "inject_fault"
call = "Authorize"
station = "${station}"
kind = "invalid_payload"
payload = { idTagInfo = { status = "Blocked" } }
times = 1

[[steps]]
name = "authorize-rejected: the next StartTransaction is Invalid"
action = "inject_fault"
call = "StartTransaction"
station = "${station}"
kind = "invalid_payload"
payload = { transactionId = 9001, idTagInfo = { status = "Invalid" } }
times = 1

[[steps]]
name = "authorize-rejected: go"
action = "call"
station = "${station}"
call = "DataTransfer"
payload = { vendorId = "${vendor}", messageId = "go:authorize-rejected" }

# ---------------------------------------------------------------------------------------
# 02 conformance-boot-pending

[[steps]]
name = "boot-pending: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:boot-pending" }
timeout_ms = 30000

[[steps]]
name = "boot-pending: the next two BootNotification CALLs are Pending"
action = "inject_fault"
call = "BootNotification"
station = "${station}"
kind = "invalid_payload"
payload = { status = "Pending", interval = 1, currentTime = "2026-01-01T00:00:00Z" }
times = 2

[[steps]]
name = "boot-pending: go"
action = "call"
station = "${station}"
call = "DataTransfer"
payload = { vendorId = "${vendor}", messageId = "go:boot-pending" }

# ---------------------------------------------------------------------------------------
# 03 conformance-boot-rejected

[[steps]]
name = "boot-rejected: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:boot-rejected" }
timeout_ms = 30000

[[steps]]
name = "boot-rejected: the next two BootNotification CALLs are Rejected"
action = "inject_fault"
call = "BootNotification"
station = "${station}"
kind = "invalid_payload"
payload = { status = "Rejected", interval = 1, currentTime = "2026-01-01T00:00:00Z" }
times = 2

[[steps]]
name = "boot-rejected: go"
action = "call"
station = "${station}"
call = "DataTransfer"
payload = { vendorId = "${vendor}", messageId = "go:boot-rejected" }

# ---------------------------------------------------------------------------------------
# 04 conformance-remote-start-stop

[[steps]]
name = "remote-start: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:remote-start" }
timeout_ms = 30000

[[steps]]
name = "remote-start: the next StartTransaction gets transaction id 4242"
action = "inject_fault"
call = "StartTransaction"
station = "${station}"
kind = "invalid_payload"
payload = { transactionId = 4242, idTagInfo = { status = "Accepted" } }
times = 1

[[steps]]
name = "remote-start: RemoteStartTransaction is Accepted"
action = "call"
station = "${station}"
call = "RemoteStartTransaction"
payload = { idTag = "CONF-TAG", connectorId = 1 }
expect_status = "Accepted"

[[steps]]
name = "remote-stop: transaction running"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:remote-stop" }
timeout_ms = 30000

[[steps]]
name = "remote-stop: RemoteStopTransaction is Accepted"
action = "call"
station = "${station}"
call = "RemoteStopTransaction"
payload = { transactionId = 4242 }
expect_status = "Accepted"

# ---------------------------------------------------------------------------------------
