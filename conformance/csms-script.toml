# 15 conformance-scripted-replies

[[steps]]
name = "scripted-replies: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:scripted-replies" }
timeout_ms = 30000

[[steps]]
name = "scripted-replies: the scripted Reset answer is Rejected"
action = "call"
station = "${station}"
call = "Reset"
payload = { type = "Soft" }
expect_status = "Rejected"

[[steps]]
name = "scripted-replies: the scripted UnlockConnector answer is a CALLERROR"
action = "call"
station = "${station}"
call = "UnlockConnector"
payload = { connectorId = 1 }
expect_error = true
