# ---------------------------------------------------------------------------------------
# 09 conformance-v201-transaction-status

[[steps]]
name = "transaction-status: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:transaction-status" }
timeout_ms = 30000

[[steps]]
name = "transaction-status: an unknown id is not ongoing and has no queued message"
action = "call"
station = "${station}"
call = "GetTransactionStatus"
payload = { transactionId = "00000000-0000-4000-8000-000000000000" }
expect_payload = { ongoingIndicator = false, messagesInQueue = false }

[[steps]]
name = "transaction-status: no queued message without an id"
action = "call"
station = "${station}"
call = "GetTransactionStatus"
payload = {}
expect_payload = { messagesInQueue = false }

[[steps]]
name = "transaction-status: go"
action = "call"
station = "${station}"
call = "DataTransfer"
payload = { vendorId = "${vendor}", messageId = "go:transaction-status-1" }

[[steps]]
name = "transaction-status: the first transaction runs"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:transaction-status-running" }
timeout_ms = 30000

[[steps]]
name = "transaction-status: the id of the first transaction"
action = "wait_call"
call = "TransactionEvent"
station = "${station}"
payload_contains = { eventType = "Started", idToken = { idToken = "CONF-TX-STATUS-1" } }
capture = { tx = "/transactionInfo/transactionId" }

[[steps]]
name = "transaction-status: the running transaction is ongoing with nothing queued"
action = "call"
station = "${station}"
call = "GetTransactionStatus"
payload = { transactionId = "${tx}" }
expect_payload = { ongoingIndicator = true, messagesInQueue = false }

[[steps]]
name = "transaction-status: no queued message without an id"
action = "call"
station = "${station}"
call = "GetTransactionStatus"
payload = {}
expect_payload = { messagesInQueue = false }

[[steps]]
name = "transaction-status: go"
action = "call"
station = "${station}"
call = "DataTransfer"
payload = { vendorId = "${vendor}", messageId = "go:transaction-status-2" }

[[steps]]
name = "transaction-status: the first transaction ended"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:transaction-status-ended" }
timeout_ms = 30000

[[steps]]
name = "transaction-status: the ended transaction is not ongoing and has nothing queued"
action = "call"
station = "${station}"
call = "GetTransactionStatus"
payload = { transactionId = "${tx}" }
expect_payload = { ongoingIndicator = false, messagesInQueue = false }

[[steps]]
name = "transaction-status: go"
action = "call"
station = "${station}"
call = "DataTransfer"
payload = { vendorId = "${vendor}", messageId = "go:transaction-status-3" }

[[steps]]
name = "transaction-status: the second transaction runs"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:transaction-status-second" }
timeout_ms = 30000

[[steps]]
name = "transaction-status: the id of the second transaction"
action = "wait_call"
call = "TransactionEvent"
station = "${station}"
payload_contains = { eventType = "Started", idToken = { idToken = "CONF-TX-STATUS-2" } }
capture = { tx2 = "/transactionInfo/transactionId" }

[[steps]]
name = "transaction-status: the next TransactionEvent is refused"
action = "inject_fault"
call = "TransactionEvent"
station = "${station}"
kind = "call_error"
times = 1

[[steps]]
name = "transaction-status: go"
action = "call"
station = "${station}"
call = "DataTransfer"
payload = { vendorId = "${vendor}", messageId = "go:transaction-status-second" }

[[steps]]
name = "transaction-status: an event is waiting"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:transaction-status-queued" }
timeout_ms = 10000

[[steps]]
name = "transaction-status: the running transaction has a queued message"
action = "call"
station = "${station}"
call = "GetTransactionStatus"
payload = { transactionId = "${tx2}" }
expect_payload = { ongoingIndicator = true, messagesInQueue = true }

[[steps]]
name = "transaction-status: a queued message is reported without an id"
action = "call"
station = "${station}"
call = "GetTransactionStatus"
payload = {}
expect_payload = { messagesInQueue = true }

[[steps]]
name = "transaction-status: the refusal was used up"
action = "faults"
station = "${station}"
expect_count = 0

[[steps]]
name = "transaction-status: go"
action = "call"
station = "${station}"
call = "DataTransfer"
payload = { vendorId = "${vendor}", messageId = "go:transaction-status-4" }

[[steps]]
name = "transaction-status: the second transaction ended"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:transaction-status-second-ended" }
timeout_ms = 10000

[[steps]]
name = "transaction-status: the ended transaction still has queued messages"
action = "call"
station = "${station}"
call = "GetTransactionStatus"
payload = { transactionId = "${tx2}" }
expect_payload = { ongoingIndicator = false, messagesInQueue = true }

[[steps]]
name = "transaction-status: scenario over"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "done:transaction-status" }
timeout_ms = 30000

# ---------------------------------------------------------------------------------------
# 10 conformance-v201-transaction-retry

[[steps]]
name = "retry: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:transaction-retry" }
timeout_ms = 30000

[[steps]]
name = "retry: the next TransactionEvent is refused once"
action = "inject_fault"
call = "TransactionEvent"
station = "${station}"
kind = "call_error"
times = 1

[[steps]]
name = "retry: go"
action = "call"
station = "${station}"
call = "DataTransfer"
payload = { vendorId = "${vendor}", messageId = "go:transaction-retry-1" }

[[steps]]
name = "retry: the first part is over"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:transaction-retry-2" }
timeout_ms = 15000

[[steps]]
name = "retry: the refusal was used up by one attempt"
action = "faults"
station = "${station}"
expect_count = 0

[[steps]]
name = "retry: the next four TransactionEvent CALLs are refused"
action = "inject_fault"
call = "TransactionEvent"
station = "${station}"
kind = "call_error"
times = 4
capture_id = "refusals"

[[steps]]
name = "retry: go"
action = "call"
station = "${station}"
call = "DataTransfer"
payload = { vendorId = "${vendor}", messageId = "go:transaction-retry-2" }

[[steps]]
name = "retry: the second part is over"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "done:transaction-retry" }
timeout_ms = 30000

[[steps]]
name = "retry: three attempts used three refusals, the fourth is left"
action = "faults"
station = "${station}"
expect_count = 1

[[steps]]
name = "retry: remove the refusal that is left"
action = "remove_fault"
id = "${refusals}"

