payload_contains = { vendorId = "${vendor}", messageId = "done:meter-values" }
timeout_ms = 30000

# ---------------------------------------------------------------------------------------
# 12 conformance-v201-scripted-replies

[[steps]]
name = "scripted-replies: station ready"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "ready:scripted-replies" }
timeout_ms = 30000

[[steps]]
name = "scripted-replies: the scripted Reset answer is Rejected"
action = "call"
station = "${station}"
call = "Reset"
payload = { type = "OnIdle" }
expect_status = "Rejected"

[[steps]]
name = "scripted-replies: the scripted UnlockConnector answer is a CALLERROR"
action = "call"
station = "${station}"
call = "UnlockConnector"
payload = { evseId = 1, connectorId = 1 }
expect_error = true

[[steps]]
name = "scripted-replies: scenario over"
action = "wait_call"
call = "DataTransfer"
station = "${station}"
payload_contains = { vendorId = "${vendor}", messageId = "done:scripted-replies" }
timeout_ms = 30000

# ---------------------------------------------------------------------------------------
# End: the station takes the answer to its last message before the connection closes.

[[steps]]
name = "end: let the station take the last answer"
action = "sleep"
ms = 1000
