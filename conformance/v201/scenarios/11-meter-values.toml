name = "conformance-v201-meter-values"
ocpp_version = "2.0.1"
description = "After the CSMS sets the measurands, the Started, Updated and Ended TransactionEvents carry one sample per configured measurand with the contexts Transaction.Begin, Sample.Periodic and Transaction.End"
tags = ["conformance", "ocpp2.0.1"]

# The CSMS script sets TxStartedMeasurands, TxUpdatedMeasurands and TxEndedMeasurands to
# energy and power with one SetVariables, and sends go:meter-values once all three are
# accepted. TxEndedInterval stays 0, so the Ended event holds the sample at the start and the
# sample at the end of the transaction and nothing in between.

[[steps]]
name = "tell the CSMS the station is ready"
action = "data_transfer"
vendor_id = "kirby-ocpp.conformance"
message_id = "ready:meter-values"

[[steps]]
name = "start of the observation window"
action = "expect_call"
call = "DataTransfer"
direction = "out"
match = { vendorId = "kirby-ocpp.conformance", messageId = "ready:meter-values" }

[[steps]]
name = "the CSMS has set the measurands"
action = "expect_call"
call = "DataTransfer"
direction = "in"
match = { vendorId = "kirby-ocpp.conformance", messageId = "go:meter-values" }

[[steps]]
action = "plug"
evse = 1

[[steps]]
action = "start_tx"
evse = 1
id_token = "CONF-METER"

[[steps]]
name = "the Started event carries the sample at the start of the transaction"
action = "expect_call"
call = "TransactionEvent"
direction = "out"
match = { eventType = "Started", meterValue = [{ sampledValue = [{ context = "Transaction.Begin", measurand = "Energy.Active.Import.Register" }, { context = "Transaction.Begin", measurand = "Power.Active.Import" }] }] }
timeout_ms = 5000

[[steps]]
action = "meter"
evse = 1
wh_delta = 1000

[[steps]]
name = "the Updated event carries one periodic sample per measurand"
action = "expect_call"
call = "TransactionEvent"
direction = "out"
match = { eventType = "Updated", triggerReason = "MeterValuePeriodic", meterValue = [{ sampledValue = [{ context = "Sample.Periodic", measurand = "Energy.Active.Import.Register", value = 1000 }, { context = "Sample.Periodic", measurand = "Power.Active.Import" }] }] }
timeout_ms = 5000

[[steps]]
action = "stop_tx"
evse = 1

[[steps]]
name = "the Ended event carries the samples at the start and at the end"
action = "expect_call"
call = "TransactionEvent"
direction = "out"
match = { eventType = "Ended", meterValue = [{ sampledValue = [{ context = "Transaction.Begin", measurand = "Energy.Active.Import.Register" }, { context = "Transaction.Begin", measurand = "Power.Active.Import" }] }, { sampledValue = [{ context = "Transaction.End", measurand = "Energy.Active.Import.Register", value = 1000 }, { context = "Transaction.End", measurand = "Power.Active.Import" }] }] }
timeout_ms = 5000

[[steps]]
name = "tell the CSMS the scenario is over"
action = "data_transfer"
vendor_id = "kirby-ocpp.conformance"
message_id = "done:meter-values"
