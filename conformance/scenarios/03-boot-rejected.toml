name = "conformance-boot-rejected"
description = "BootNotification answered Rejected: the station sends BootNotification again after the interval until it is accepted"
tags = ["conformance"]

# The CSMS script answers the next two BootNotification CALLs with
# status Rejected and interval 1, then sends the go message. The third one
# gets the normal Accepted answer.

[[steps]]
name = "tell the CSMS the station is ready"
action = "data_transfer"
vendor_id = "kirby-ocpp.conformance"
message_id = "ready:boot-rejected"

[[steps]]
name = "start of the observation window"
action = "expect_call"
call = "DataTransfer"
direction = "out"
match = { vendorId = "kirby-ocpp.conformance", messageId = "ready:boot-rejected" }

[[steps]]
name = "the CSMS has prepared its answers"
action = "expect_call"
call = "DataTransfer"
direction = "in"
match = { vendorId = "kirby-ocpp.conformance", messageId = "go:boot-rejected" }

[[steps]]
action = "boot"

[[steps]]
name = "the registration is rejected"
action = "wait_for"
condition = { kind = "registration", status = "Rejected" }

[[steps]]
name = "first BootNotification"
action = "expect_call"
call = "BootNotification"
direction = "out"

[[steps]]
name = "BootNotification again after the interval"
action = "expect_call"
call = "BootNotification"
direction = "out"
timeout_ms = 5000

[[steps]]
name = "BootNotification once more"
action = "expect_call"
call = "BootNotification"
direction = "out"
timeout_ms = 5000

[[steps]]
name = "the registration is accepted"
action = "wait_for"
condition = { kind = "registration", status = "Accepted" }
timeout_ms = 5000

[[steps]]
name = "tell the CSMS the scenario is over"
action = "data_transfer"
vendor_id = "kirby-ocpp.conformance"
message_id = "done:boot-rejected"
