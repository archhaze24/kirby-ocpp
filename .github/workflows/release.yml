name: Release

# Builds release binaries. Runs only on a `v*` tag push (which also creates a GitHub
# release and pushes the container image to ghcr.io) or manually. A manual run only builds and
# packages (the image is built but not pushed); it never creates a release.
# On a tag push the tag must equal the workspace version in Cargo.toml, and CHANGELOG.md must
# have a section for it: that section becomes the release notes.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: tag matches Cargo version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with workspace version
        if: github.event_name == 'push'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kirby-ocpp") | .version')"
          tag_version="${REF_NAME#v}"
          if [ -z "$cargo_version" ] || [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::tag '$REF_NAME' does not match the Cargo workspace version '$cargo_version'"
            exit 1
          fi
          echo "tag $REF_NAME matches Cargo version $cargo_version"

      # Fails the run (manual runs included) when CHANGELOG.md has no notes for this version.
      - name: Check the release notes
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ github.event_name == 'push' }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            tag="$REF_NAME"
          else
            tag="v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kirby-ocpp") | .version')"
          fi
          .github/scripts/release-notes.sh "$tag" > release-notes.md
          echo "notes for $tag:"
          cat release-notes.md

  # Man pages come from the clap definitions through the test that also checks that every
  # flag is listed; one run serves every target.
  man:
    name: man pages
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Generate
        shell: bash
        env:
          KIRBY_OCPP_MAN_DIR: ${{ github.workspace }}/man/man1
          KIRBY_CSMS_MAN_DIR: ${{ github.workspace }}/man/man1
        run: |
          cargo test --locked -p kirby-ocpp -p kirby-csms --bin kirby-ocpp --bin kirby-csms man_page
          ls man/man1

      - uses: actions/upload-artifact@v7
        with:
          name: man
          path: man
          if-no-files-found: error

  build:
    name: ${{ matrix.target }}
    needs: [version, man]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/download-artifact@v8
        with:
          name: man
          path: man

      - name: Build
        shell: bash
        env:
          # ring compiles C code; point it at the musl wrapper (ignored for other targets).
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p kirby-ocpp -p kirby-csms --target "$TARGET"

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          # Branch names may contain "/" (manual runs); tags cannot be affected.
          name="kirby-ocpp-${REF_NAME//\//-}-${TARGET}"
          mkdir "$name"
          cp "target/${TARGET}/release/kirby-ocpp" "target/${TARGET}/release/kirby-csms" LICENSE crates/kirby-ocpp/THIRD_PARTY_NOTICES.md README.md "$name/"
          cp crates/kirby-csms/THIRD_PARTY_NOTICES.md "$name/THIRD_PARTY_NOTICES-kirby-csms.md"
          cp -R man "$name/man"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"; else shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          $name = "kirby-ocpp-$($env:REF_NAME -replace '/', '-')-$($env:TARGET)"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/$($env:TARGET)/release/kirby-ocpp.exe", "target/$($env:TARGET)/release/kirby-csms.exe", LICENSE, crates/kirby-ocpp/THIRD_PARTY_NOTICES.md, README.md $name
          Copy-Item crates/kirby-csms/THIRD_PARTY_NOTICES.md "$name/THIRD_PARTY_NOTICES-kirby-csms.md"
          Copy-Item man "$name/man" -Recurse
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
          "ASSET=$name.zip" | Out-File -Append -Encoding ascii $env:GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: build
    # Only a real tag push creates a release.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          # The target artifacts only (their names contain a dash); `man` is inside the archives.
          pattern: "*-*"
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          flags=()
          case "$REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          # The notes come from CHANGELOG.md; the file stays out of dist/ so it is not an asset.
          .github/scripts/release-notes.sh "$REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$REF_NAME" dist/* \
            --repo "$REPO" \
            --title "$REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"

      # Homebrew formula and Scoop manifest with the real checksums. Uploaded as a workflow
      # artifact, NOT as release assets; they are pushed to the tap and bucket repos after the release.
      - name: Render packaging files
        env:
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/render-packaging.sh "$REF_NAME" dist "$RUNNER_TEMP/packaging"

      - uses: actions/upload-artifact@v7
        with:
          name: packaging
          path: ${{ runner.temp }}/packaging/*
          if-no-files-found: error

  # Ordering vs `publish` (needs both, so a failed release never leaves a pushed public image):
  #  - tag push, publish ok:      publish.result == success -> image builds and pushes.
  #  - tag push, publish fails:   publish.result == failure -> image skipped, nothing pushed.
  #  - manual run:                publish is skipped (not a tag push) -> the condition lets the
  #                               image build run anyway, without pushing.
  # `!cancelled()` is required: without a status function a skipped `publish` skips this job too.
  image:
    name: container image
    needs: [build, publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && (github.event_name != 'push' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/archhaze24/kirby-ocpp
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags, to find the highest published version

      # Only the two static musl builds go into the image.
      - uses: actions/download-artifact@v8
        with:
          name: x86_64-unknown-linux-musl
          path: artifacts/amd64
      - uses: actions/download-artifact@v8
        with:
          name: aarch64-unknown-linux-musl
          path: artifacts/arm64

      - name: Unpack binaries into the build context
        shell: bash
        run: |
          for arch in amd64 arm64; do
            mkdir -p "dist/linux-$arch"
            archive=(artifacts/"$arch"/*.tar.gz)
            [ "${#archive[@]}" -eq 1 ] || { echo "::error::expected one archive in artifacts/$arch"; exit 1; }
            tar -xzf "${archive[0]}" -C "dist/linux-$arch" --strip-components=1 --wildcards '*/kirby-ocpp' '*/kirby-csms'
            ls -l "dist/linux-$arch"
          done

      # Tags on a real tag push: X.Y.Z always; X.Y and latest only for a final version that is
      # the highest final v* tag (re-tagging an old 0.4.x must not move `latest` backwards).
      - name: Compute tags
        id: meta
        shell: bash
        env:
          IS_TAG: ${{ github.event_name == 'push' }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$IS_TAG" = "true" ]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-manual"
          fi
          highest="$(git tag --list 'v*' | grep -v -e '-' | sort -V | tail -1 || true)"
          echo "highest final tag: ${highest:-none}"
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "$IMAGE:$version"
            if [ "$IS_TAG" = "true" ] && [ "$REF_NAME" = "$highest" ]; then
              echo "$IMAGE:${version%.*}"
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
