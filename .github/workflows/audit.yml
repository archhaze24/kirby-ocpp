name: Audit

# Checks Cargo.lock against the RustSec advisory database on every push and once a week, so
# an advisory published after the last change is still noticed before a release.
on:
  push:
    branches:
      - main
      - "ci-check/**"
      - "dev-*"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny

      - name: Advisories
        run: cargo deny check advisories
