name: Audit

# Checks Cargo.lock against the RustSec advisory database on every push and once a week, so
# an advisory published after the last change is still noticed before a release.
on:
  push:
    branches:
      - main
      - "ci-check/**"
      - "dev-*"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny

      - name: Advisories
        run: cargo deny check advisories

      # The web UI is a separate workspace with its own lock file.
      - name: Advisories (web UI)
        run: cargo deny --manifest-path crates/kirby-csms-web/Cargo.toml check advisories
