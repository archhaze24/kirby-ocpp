name: Rust

on:
  push:
    branches:
      - main
      - "ci-check/**"
      - "dev-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install nextest
        uses: taiki-e/install-action@v2.90.1
        with:
          tool: nextest

      # One process per test (the `ci` profile in .config/nextest.toml kills hung tests).
      - name: Test (nextest)
        run: cargo nextest run --workspace --profile ci

      - name: Doctests
        run: cargo test --workspace --doc

      # Tests of a crate share one process under `cargo test`: keep one run of that mode.
      - name: Test (shared process)
        if: runner.os == 'Linux'
        run: cargo test --workspace --tests
