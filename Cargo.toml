[workspace]
resolver = "3"
members = ["crates/kirby-ocpp-core", "crates/kirby-ocpp-tui", "crates/kirby-ocpp", "crates/kirby-ocpp-testkit"]
default-members = ["crates/kirby-ocpp-core", "crates/kirby-ocpp-tui", "crates/kirby-ocpp"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/archhaze24/kirby-ocpp"
homepage = "https://github.com/archhaze24/kirby-ocpp#readme"

[workspace.dependencies]
# internal
kirby-ocpp-core = { path = "crates/kirby-ocpp-core", version = "0.2.0-dev" }
kirby-ocpp-tui = { path = "crates/kirby-ocpp-tui", version = "0.2.0-dev" }
kirby-ocpp-testkit = { path = "crates/kirby-ocpp-testkit", version = "0.2.0-dev" }

# external (latest stable at skeleton time; crates used only in later stages are
# added to this table by the stage that first compiles against them)
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
base64 = "0.22.1"
crossterm = "0.29.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
jsonschema = { version = "0.60.2", default-features = false }
percent-encoding = "2.3.2"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rcgen = "0.14.10"
ratatui = "0.30.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
url = "2.5.8"
uuid = { version = "1.26.1", default-features = false, features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "deny"
dbg_macro = "deny"
# pragmatic pedantic opt-outs
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow" # OCPP action and key names are CamelCase prose
must_use_candidate = "allow"
return_self_not_must_use = "allow"
