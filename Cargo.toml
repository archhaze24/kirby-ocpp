[workspace]
resolver = "3"
members = ["crates/kirby-ocpp-core", "crates/kirby-csms-core", "crates/kirby-ocpp-tui", "crates/kirby-csms-tui", "crates/kirby-ocpp", "crates/kirby-csms", "crates/kirby-ocpp-testkit"]
default-members = ["crates/kirby-ocpp-core", "crates/kirby-csms-core", "crates/kirby-ocpp-tui", "crates/kirby-csms-tui", "crates/kirby-ocpp", "crates/kirby-csms"]

[workspace.package]
version = "0.5.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/archhaze24/kirby-ocpp"
homepage = "https://github.com/archhaze24/kirby-ocpp#readme"

[workspace.dependencies]
# internal
kirby-ocpp-core = { path = "crates/kirby-ocpp-core", version = "0.5.0-dev" }
kirby-csms-core = { path = "crates/kirby-csms-core", version = "0.5.0-dev" }
kirby-csms-tui = { path = "crates/kirby-csms-tui", version = "0.5.0-dev" }
kirby-ocpp-tui = { path = "crates/kirby-ocpp-tui", version = "0.5.0-dev" }
kirby-ocpp-testkit = { path = "crates/kirby-ocpp-testkit" }

# external (latest stable at skeleton time; crates used only in later stages are
# added to this table by the stage that first compiles against them)
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
base64 = "0.22.1"
crossterm = "0.29.0"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["server", "service", "tokio"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
jsonschema = { version = "0.60.2", default-features = false }
nucleo-matcher = "0.3.1"
percent-encoding = "2.3.2"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", features = ["x509-parser"] }
ring = "0.17.14"
time = { version = "0.3.55", default-features = false }
x509-parser = "0.18.1"
ratatui = "0.30.2"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
socket2 = { version = "0.6.5", features = ["all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
url = "2.5.8"
uuid = { version = "1.26.1", default-features = false, features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
todo = "deny"
dbg_macro = "deny"
# pragmatic pedantic opt-outs
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow" # OCPP action and key names are CamelCase prose
must_use_candidate = "allow"
return_self_not_must_use = "allow"

# Test binaries are linked per integration-test file (70+ of them); full debuginfo made each
# one ~190 MiB and the links dominate build time. Line tables keep readable backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
