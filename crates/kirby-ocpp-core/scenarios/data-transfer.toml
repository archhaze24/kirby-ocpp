name = "data-transfer"
description = "Send a DataTransfer with a vendor id (variable vendor_id, override with --var) and check the CALL went out. Any DataTransfer status is accepted, UnknownVendorId included."

[vars]
vendor_id = "kirby"

[[steps]]
action = "data_transfer"
vendor_id = "${vendor_id}"
message_id = "ping"
data = "hello from ${station_id}"

[[steps]]
action = "expect_call"
call = "DataTransfer"
direction = "out"
match = { vendorId = "${vendor_id}", messageId = "ping" }
timeout_ms = 3000
