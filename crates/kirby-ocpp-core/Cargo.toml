[package]
name = "kirby-ocpp-core"
description = "OCPP 1.6J, 2.0.1 and 2.1 charge point emulator core: frames, station actors, connection layer (no UI)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ocpp", "ev-charging", "emulator", "websocket"]
categories = ["development-tools::testing", "network-programming"]

[lib]
name = "kirby_ocpp_core"

[dependencies]
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rcgen.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net"] }
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
x509-parser.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { workspace = true, features = ["wasmbind"] }
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
kirby-ocpp-testkit.workspace = true
proptest.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }

[lints]
workspace = true
