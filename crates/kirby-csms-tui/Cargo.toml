[package]
name = "kirby-csms-tui"
description = "Terminal UI for the kirby-csms central system (observe many stations)"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["ocpp", "ev-charging", "csms", "tui"]
categories = ["command-line-utilities", "development-tools::testing", "network-programming"]

[lib]
name = "kirby_csms_tui"

[dependencies]
kirby-csms-core.workspace = true
kirby-ocpp-core.workspace = true
kirby-ocpp-tui.workspace = true
chrono.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
futures-util.workspace = true
nucleo-matcher.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
