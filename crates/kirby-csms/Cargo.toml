[package]
name = "kirby-csms"
description = "Terminal OCPP 1.6J central system (CSMS) for charge point firmware development and load tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ocpp", "ev-charging", "csms", "websocket"]
categories = ["command-line-utilities", "development-tools::testing", "network-programming"]

[[bin]]
name = "kirby-csms"
path = "src/main.rs"

[dependencies]
kirby-csms-core.workspace = true
kirby-csms-tui.workspace = true
kirby-ocpp-core.workspace = true
kirby-ocpp-tui.workspace = true
axum.workspace = true
chrono.workspace = true
clap.workspace = true
futures-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
percent-encoding.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
socket2.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "signal", "net"] }
tokio-rustls.workspace = true
url.workspace = true

[dev-dependencies]
clap_mangen.workspace = true
jsonschema.workspace = true
kirby-ocpp-core.workspace = true
rcgen.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
