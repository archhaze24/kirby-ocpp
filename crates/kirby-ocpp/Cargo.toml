[package]
name = "kirby-ocpp"
description = "Terminal OCPP 1.6J charge point emulator for CSMS testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ocpp", "ev-charging", "emulator", "tui", "websocket"]
categories = ["command-line-utilities", "development-tools::testing", "network-programming"]

[[bin]]
name = "kirby-ocpp"
path = "src/main.rs"

[dependencies]
kirby-ocpp-core.workspace = true
kirby-ocpp-tui.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
chrono.workspace = true

[dev-dependencies]
kirby-ocpp-testkit.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
